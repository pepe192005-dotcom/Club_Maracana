{% extends 'base.html' %}

{% block title %}Reserva Exitosa{% endblock %}

{% block content %}
<div class="container my-5" style="max-width: 700px;">

    <div class="card shadow-sm border-0 p-4">
        
        <div class="text-center mb-3">
            <div class="bg-success bg-opacity-10 text-success rounded-circle d-inline-flex 
                        justify-content-center align-items-center"
                 style="width: 90px; height: 90px;">
                <i class="bi bi-check-circle-fill fs-1"></i>
            </div>
        </div>

        <h2 class="text-center fw-bold mb-3">¡Reserva realizada con éxito!</h2>

        <p class="text-center text-muted mb-4">
            Tu reserva ha sido registrada correctamente.
            <br>Podrás consultar su estado y método de pago en cualquier momento.
        </p>

        <div class="d-flex flex-column align-items-center gap-3">

            <a href="{{ url_for('mis_reservas') }}" class="btn btn-primary w-75">
                <i class="bi bi-receipt me-1"></i> Ver mis reservas
            </a>

            <a href="{{ url_for('menu') }}" class="btn btn-outline-secondary w-75">
                <i class="bi bi-house me-1"></i> Volver al menú principal
            </a>
        </div>
    </div>

</div>
{% endblock %}
