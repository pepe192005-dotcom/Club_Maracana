{% extends 'base.html' %}
{% block title %}Registrar árbitro{% endblock %}

{% block content %}
<div class="container my-4" style="max-width: 700px;">

  <!-- Encabezado -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 fw-bold mb-0">
      <i class="bi bi-person-plus-fill me-2"></i> Registrar árbitro
    </h1>
    <a href="{{ url_for('listarArbitros') }}" class="btn btn-outline-primary">
      <i class="bi bi-arrow-left me-1"></i> Volver
    </a>
  </div>

  <!-- Card -->
  <div class="card shadow-sm border-0">
    <div class="card-body p-4">

      <!-- Formulario -->
      <form action="{{ url_for('registrarArbitro') }}" method="post" class="row g-3">

        <!-- Nombre -->
        <div class="col-md-6">
          <label class="form-label fw-semibold">Nombre</label>
          <input type="text" name="nombre" class="form-control" placeholder="Ej. Juan" required>
        </div>

        <!-- Apellido -->
        <div class="col-md-6">
          <label class="form-label fw-semibold">Apellido</label>
          <input type="text" name="apellido" class="form-control" placeholder="Ej. Pérez" required>
        </div>

        <!-- Teléfono -->
        <div class="col-md-6">
          <label class="form-label fw-semibold">Teléfono</label>
          <input type="tel" name="telefono" class="form-control" placeholder="3511234567" required>
        </div>

        <!-- Correo -->
        <div class="col-md-6">
          <label class="form-label fw-semibold">Correo electrónico</label>
          <input type="email" name="correo" class="form-control" placeholder="correo@ejemplo.com" required>
        </div>

        <!-- Categoría -->
        <div class="col-md-6">
          <label class="form-label fw-semibold">Categoría</label>
          <select name="categoria" class="form-select" required>
            <option value="">-- Selecciona --</option>
            <option value="Local">Local</option>
            <option value="Regional">Regional</option>
            <option value="Nacional">Nacional</option>
            <option value="Internacional">Internacional</option>
          </select>
        </div>

        <!-- Disponibilidad -->
        <div class="col-md-6">
          <label class="form-label fw-semibold">Disponibilidad</label>
          <select name="disponibilidad" class="form-select" required>
            <option value="">-- Selecciona --</option>
            <option value="Disponible">Disponible</option>
            <option value="Ocupado">Ocupado</option>
          </select>
        </div>

        <!-- Eventos -->
        <div class="col-12">
          <label class="form-label fw-semibold">Eventos asignados</label>
          <select name="id_evento" id="id_evento" multiple class="form-select">
            <option value="">Sin evento asignado</option>
            {% for evento in eventos %}
              <option value="{{ evento.id_evento }}">
                {{ evento.nombre_evento }} (ID: {{ evento.id_evento }})
              </option>
            {% endfor %}
          </select>
          <small class="text-muted">
            Mantén presionada <strong>Ctrl</strong> para seleccionar varios.
          </small>
        </div>

        <!-- Mensaje de error -->
        {% if msg %}
        <div class="col-12">
          <div class="alert alert-danger">{{ msg }}</div>
        </div>
        {% endif %}

        <!-- Botón -->
        <div class="col-12 text-end mt-3">
          <button type="submit" class="btn btn-success px-4">
            <i class="bi bi-check-circle me-1"></i> Guardar árbitro
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
{% endblock %}
