{% extends 'base.html' %}
{% block title %}Inscribir equipo a torneo{% endblock %}

{% block content %}
<section class="py-4">
  <div class="container">

    <!-- Título y descripción -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="h3 fw-bold mb-1">
          Inscribir equipo al torneo
        </h1>
        <p class="text-muted mb-0">
          Torneo seleccionado:
          <span class="fw-semibold text-primary">{{ evento.nombre_evento }}</span>
        </p>
      </div>

      <a href="{{ url_for('listar_torneos') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i> Volver a torneos
      </a>
    </div>

    <!-- Card del formulario -->
    <div class="card border-0 shadow-sm rounded-4">
      <div class="card-body p-4 p-md-5">

        {% if msg %}
        <div class="alert alert-danger small" role="alert">
          {{ msg }}
        </div>
        {% endif %}

        <form method="post" class="row g-3">

          <!-- Equipo -->
          <div class="col-12 col-md-8">
            <label for="id_equipos_torneo" class="form-label">Equipo</label>
            <select
              name="id_equipos_torneo"
              id="id_equipos_torneo"
              class="form-select"
              required
            >
              {% for eq in equipos %}
              <option value="{{ eq.id_equipos_torneo }}">{{ eq.nombreEquipo }}</option>
              {% endfor %}
            </select>
          </div>

          <!-- Botones -->
          <div class="col-12 d-flex flex-wrap gap-2 mt-3">
            <button type="submit" class="btn btn-success">
              <i class="bi bi-check-circle me-1"></i> Inscribir equipo
            </button>

            <a href="{{ url_for('registrarTorneo') }}" class="btn btn-outline-primary">
              <i class="bi bi-plus-circle me-1"></i> Agregar nuevo equipo
            </a>

            <a href="{{ url_for('listar_torneos') }}" class="btn btn-outline-secondary ms-auto">
              Cancelar
            </a>
          </div>

        </form>

      </div>
    </div>

  </div>
</section>
{% endblock %}
